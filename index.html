<style>
  :root{
    --bg:#0A0B0D;
    --panel:#0F1114;
    --line:#1C2027;
    --line-soft:#15181D;
    --fg:#E6E9EC;
    --dim:#767C82;
    --iri-a:#7CE0D3;
    --iri-b:#8AA8FF;
    --iri-c:#C78BFF;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(680px 420px at 50% -10%, rgba(138,168,255,.07), transparent 70%),
      radial-gradient(520px 380px at 90% 110%, rgba(199,139,255,.05), transparent 70%);
  }

  main{
    position:relative;
    width:100%;
    max-width:460px;
  }

  header{
    text-align:center;
    margin-bottom:34px;
  }

  .mark{
    width:76px;
    height:48px;
    display:block;
    margin:0 auto 18px;
    overflow:visible;
  }

  .mark .chev{
    fill:none;
    stroke:var(--fg);
    stroke-width:3.2;
    stroke-linecap:square;
    stroke-linejoin:miter;
    stroke-dasharray:60;
    stroke-dashoffset:60;
    animation:draw .7s cubic-bezier(.4,0,.2,1) .15s forwards;
  }

  .mark .spark{
    fill:var(--fg);
    transform-origin:44px 20px;
    opacity:0;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.4) .72s forwards;
  }

  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes pop{
    0%{ opacity:0; transform:scale(.4); }
    60%{ opacity:1; transform:scale(1.18); }
    100%{ opacity:1; transform:scale(1); }
  }

  h1{
    font-family:var(--mono);
    font-weight:500;
    font-size:19px;
    letter-spacing:.02em;
    margin:0 0 8px;
  }

  .role{
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.6;
    color:var(--dim);
    margin:0;
  }

  .role b{
    color:var(--fg);
    font-weight:400;
  }

  nav{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .link{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    transition:border-color .2s ease, transform .2s ease, background .2s ease;
    opacity:0;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
  }

  .link::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:2px;
    background:linear-gradient(180deg, var(--iri-a), var(--iri-b), var(--iri-c));
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
  }

  .link:hover,
  .link:focus-visible{
    border-color:#2A3038;
    background:#12151A;
    transform:translateX(3px);
  }

  .link:hover::before,
  .link:focus-visible::before{ transform:scaleY(1); }

  .link:focus-visible{
    outline:2px solid var(--iri-b);
    outline-offset:2px;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .link:nth-child(1){ animation-delay:.85s; }
  .link:nth-child(2){ animation-delay:.93s; }
  .link:nth-child(3){ animation-delay:1.01s; }
  .link:nth-child(4){ animation-delay:1.09s; }

  .icon{
    flex:0 0 20px;
    width:20px;
    height:20px;
    color:var(--dim);
    transition:color .2s ease;
  }

  .link:hover .icon,
  .link:focus-visible .icon{ color:var(--fg); }

  .body{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .name{
    font-family:var(--mono);
    font-size:13.5px;
    letter-spacing:.01em;
  }

  .handle{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .go{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:13px;
    color:var(--dim);
    transform:translateX(-4px);
    opacity:0;
    transition:transform .2s ease, opacity .2s ease;
  }

  .link:hover .go,
  .link:focus-visible .go{
    transform:translateX(0);
    opacity:1;
  }

  footer{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--line-soft);
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    opacity:0;
    animation:rise .5s ease 1.19s forwards;
  }

  footer a{ color:var(--dim); }

  @media (max-width:400px){
    body{ padding:36px 16px; }
    .name{ font-size:13px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    .link, footer{ opacity:1; }
    .mark .chev{ stroke-dashoffset:0; }
    .mark .spark{ opacity:1; }
  }
</style>
</head>
